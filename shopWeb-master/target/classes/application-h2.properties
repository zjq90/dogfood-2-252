# H2内存数据库配置
# 用于演示和开发环境，当MySQL不可用时可以启用此配置
# 使用方式: 在application.properties中设置 spring.profiles.active=h2

server.port=8080
server.servlet.context-path=/shop

# H2 数据库配置
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:shopdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# H2 控制台配置
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 连接池配置
spring.datasource.druid.initial-size=2
spring.datasource.druid.max-active=10
spring.datasource.druid.min-idle=2
spring.datasource.druid.max-wait=30000

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.shop.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 日志配置
logging.level.com.shop=DEBUG
logging.level.org.springframework=INFO
logging.level.org.mybatis=DEBUG

# 视图解析器配置
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
